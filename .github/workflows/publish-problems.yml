name: Publish problems

on:
  workflow_dispatch:
    inputs:
      force_slot:
        description: "Slot da pubblicare (lunedi oppure giovedi)"
        required: false
        default: ""
  schedule:
    - cron: "0 5 * * 1"
    - cron: "0 5 * * 4"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run publisher
        env:
          FORCE_SLOT: ${{ github.event.inputs.force_slot }}
        run: python scripts/publish.py

      - name: Commit and push updated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add current.json state.json
          git diff --cached --quiet || git commit -m "Update current problems"
          git push
