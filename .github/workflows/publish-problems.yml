name: Publish problems

on:
  workflow_dispatch:
    inputs:
      force_slot:
        description: "Slot da pubblicare"
        required: true
        default: "lunedi"
        type: choice
        options:
          - lunedi
          - giovedi
  schedule:
    - cron: '0 6 * * 1'
    - cron: '0 6 * * 4'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Publish selected slot
        run: python scripts/publish.py
        env:
          FORCE_SLOT: ${{ github.event.inputs.force_slot }}

      - name: Commit updated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add current.json data/state.json
          git diff --cached --quiet || git commit -m "Aggiorna problemi della settimana"
          git push
